<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BookShelf">
<meta name="theme-color" content="#1a1a2e">
<title>BookShelf</title>
<style>
:root{--bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;--accent:#e94560;--accent2:#f5a623;--text:#eaeaea;--text2:#a0a0b0;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px;overscroll-behavior:none}
.header{position:sticky;top:0;z-index:100;background:var(--surface);padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.07);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.header h1{font-size:1.2rem;font-weight:700;flex:1}
.header .hbtn{background:none;border:none;color:var(--text2);font-size:1.2rem;cursor:pointer;padding:4px}
.search-bar{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.07);border-radius:24px;padding:10px 16px;margin:12px 16px;border:1px solid rgba(255,255,255,0.1)}
.search-bar input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:0.95rem}
.search-bar input::placeholder{color:var(--text2)}
.search-bar button{background:none;border:none;cursor:pointer;font-size:1.1rem}
.tabs{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:8px 16px;border-radius:20px;border:none;background:var(--surface);color:var(--text2);font-size:0.85rem;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.tab-btn.active{background:var(--accent);color:#fff;font-weight:600}
.section{padding:0 16px 16px}
.section-title{font-size:0.78rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text2);margin-bottom:12px}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 16px 16px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:12px 8px;text-align:center;border:1px solid rgba(255,255,255,0.06)}
.stat-card .num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-card .lbl{font-size:0.7rem;color:var(--text2);margin-top:2px}
.books-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.book-card{background:var(--surface);border-radius:var(--radius);overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,0.06);position:relative;transition:transform 0.15s}
.book-card:active{transform:scale(0.97)}
.cover-wrap{width:100%;aspect-ratio:2/3;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:3rem;overflow:hidden}
.cover-wrap img{width:100%;height:100%;object-fit:cover}
.book-card .info{padding:10px}
.book-card .title{font-size:0.85rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.book-card .author{font-size:0.75rem;color:var(--text2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-badge{position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:12px;font-size:0.65rem;font-weight:600}
.badge-reading{background:#f5a623;color:#000}
.badge-read{background:#27ae60;color:#fff}
.badge-want{background:#8e44ad;color:#fff}
.books-list{display:flex;flex-direction:column;gap:12px}
.book-list-item{background:var(--surface);border-radius:var(--radius);padding:12px;display:flex;gap:12px;cursor:pointer;border:1px solid rgba(255,255,255,0.06);transition:transform 0.15s;align-items:flex-start}
.book-list-item:active{transform:scale(0.98)}
.mini-cover{width:52px;height:78px;border-radius:6px;background:var(--surface2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.8rem;overflow:hidden}
.mini-cover img{width:100%;height:100%;object-fit:cover}
.bk-meta{flex:1;min-width:0}
.bk-meta .title{font-size:0.9rem;font-weight:600;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk-meta .author{font-size:0.8rem;color:var(--text2)}
.bk-meta .extra{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:0.68rem;padding:2px 8px;border-radius:10px;background:var(--surface2);color:var(--text2)}
.stars{color:var(--accent2);font-size:0.75rem;margin-top:4px}
.progress-bar{height:5px;background:rgba(255,255,255,0.1);border-radius:3px;margin:6px 0 2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width 0.4s}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid rgba(255,255,255,0.07);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:100;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;padding:4px;color:var(--text2);font-size:0.62rem;transition:color 0.2s}
.nav-btn .ic{font-size:1.3rem}
.nav-btn.active{color:var(--accent)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.3s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;max-height:90vh;overflow-y:auto;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin:12px auto 16px}
.mc{padding:0 20px 24px}
.m-cover{width:110px;height:165px;border-radius:10px;background:var(--surface2);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:4rem;overflow:hidden}
.m-cover img{width:100%;height:100%;object-fit:cover}
.m-title{font-size:1.1rem;font-weight:700;text-align:center;margin-bottom:6px}
.m-author{font-size:0.9rem;color:var(--text2);text-align:center;margin-bottom:14px}
.m-desc{font-size:0.84rem;color:var(--text2);line-height:1.6;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.m-desc.exp{-webkit-line-clamp:unset}
.info-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.info-chip{background:var(--surface2);padding:5px 12px;border-radius:20px;font-size:0.78rem;color:var(--text2)}
.status-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sbtn{padding:12px 6px;border-radius:12px;border:2px solid transparent;background:var(--surface2);color:var(--text);font-size:0.78rem;cursor:pointer;text-align:center;transition:all 0.2s}
.sbtn .si{font-size:1.4rem;display:block;margin-bottom:4px}
.sbtn.aw{border-color:#8e44ad;background:rgba(142,68,173,0.2)}
.sbtn.ar{border-color:var(--accent2);background:rgba(245,166,35,0.2)}
.sbtn.ad{border-color:#27ae60;background:rgba(39,174,96,0.2)}
.btn-p{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:0.95rem;font-weight:600;cursor:pointer;margin-bottom:10px}
.btn-s{width:100%;padding:12px;background:var(--surface2);color:var(--text);border:none;border-radius:var(--radius);font-size:0.9rem;cursor:pointer;margin-bottom:8px}
.rating-input{display:flex;gap:8px;margin:8px 0 12px}
.rstar{font-size:1.6rem;cursor:pointer;opacity:0.35;transition:transform 0.1s,opacity 0.1s}
.rstar.on{opacity:1}
.rstar:active{transform:scale(1.3)}
.notes-area{width:100%;background:var(--surface2);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius);color:var(--text);font-size:0.9rem;padding:12px;resize:none;min-height:80px;margin-bottom:10px;font-family:inherit}
.spinner-wrap{display:flex;justify-content:center;padding:50px}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty .emo{font-size:4rem;margin-bottom:16px}
.empty h3{font-size:1.1rem;margin-bottom:8px;color:var(--text)}
.empty p{font-size:0.85rem;line-height:1.5}
.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(22,22,46,0.97);color:var(--text);padding:12px 20px;border-radius:24px;font-size:0.85rem;z-index:300;opacity:0;transition:all 0.3s;white-space:nowrap;border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(10px);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lang-toggle{display:flex;gap:6px;margin:0 16px 12px;flex-wrap:wrap}
.lbtn{padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:none;color:var(--text2);font-size:0.8rem;cursor:pointer}
.lbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.page-input{width:80px;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:var(--surface2);color:var(--text);font-size:0.9rem;text-align:center}
a.link-btn{display:block;text-align:center;padding:12px;background:var(--surface2);color:var(--accent);border-radius:var(--radius);font-size:0.9rem;text-decoration:none;margin-bottom:8px}
</style>
</head>
<body>

<div id="main"></div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-nav="home" onclick="navigate('home')">
    <span class="ic">🏠</span>Головна
  </button>
  <button class="nav-btn" data-nav="library" onclick="navigate('library')">
    <span class="ic">📚</span>Бібліотека
  </button>
  <button class="nav-btn" data-nav="search" onclick="navigate('search')">
    <span class="ic">🔍</span>Пошук
  </button>
  <button class="nav-btn" data-nav="recs" onclick="navigate('recs')">
    <span class="ic">✨</span>Для тебе
  </button>
  <button class="nav-btn" data-nav="stats" onclick="navigate('stats')">
    <span class="ic">📊</span>Стат.
  </button>
</nav>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <div id="modalContent"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ============ DB ============
const DB_NAME='bookshelf_db',DB_VER=2;let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('books')){
        const s=d.createObjectStore('books',{keyPath:'id'});
        s.createIndex('status','status');s.createIndex('addedAt','addedAt');
      }
      if(!d.objectStoreNames.contains('settings'))
        d.createObjectStore('settings',{keyPath:'key'});
    };
    r.onsuccess=e=>{db=e.target.result;res(db)};
    r.onerror=()=>rej(r.error);
  });
}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function dbGet(s,k){return new Promise((r,j)=>{const q=tx(s).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>j()})}
function dbPut(s,v){return new Promise((r,j)=>{const q=tx(s,'readwrite').put(v);q.onsuccess=()=>r(q.result);q.onerror=()=>j()})}
function dbDel(s,k){return new Promise((r,j)=>{const q=tx(s,'readwrite').delete(k);q.onsuccess=()=>r();q.onerror=()=>j()})}
function dbAll(s,idx,val){
  return new Promise((r,j)=>{
    const st=tx(s);
    const q=idx?st.index(idx).getAll(val):st.getAll();
    q.onsuccess=()=>r(q.result);q.onerror=()=>j();
  });
}
const getAllBooks=()=>dbAll('books');
const getByStatus=s=>dbAll('books','status',s);
const saveBook=b=>dbPut('books',b);
const deleteBook=id=>dbDel('books',id);
const getBook=id=>dbGet('books',id);

// ============ API ============
const BLACKLIST_CAT=['poetry','поезія','вірші','poems','soviet','ussr','propaganda','communist','socialist realism','соцреалізм'];
const BLACKLIST_TITLE=['ленін','сталін','маркс','ленин','сталин','кпрс','кпсс','советский','октябрьская'];

async function searchGoogle(q,lang=''){
  try{
    const l=lang?`&langRestrict=${lang}`:'';
    const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=20&printType=books${l}`);
    const d=await r.json();
    if(!d.items)return[];
    return d.items.map(i=>({
      id:'gb_'+i.id,src:'google',
      title:i.volumeInfo.title||'Без назви',
      authors:i.volumeInfo.authors||['Невідомий автор'],
      desc:i.volumeInfo.description||'',
      cover:i.volumeInfo.imageLinks?.thumbnail?.replace('http:','https:')||null,
      year:i.volumeInfo.publishedDate?.substring(0,4)||'',
      pages:i.volumeInfo.pageCount||0,
      cats:i.volumeInfo.categories||[],
      lang:i.volumeInfo.language||'',
      link:i.volumeInfo.previewLink||'',
      rating:i.volumeInfo.averageRating||0,
      rcount:i.volumeInfo.ratingsCount||0
    }));
  }catch(e){return[]}
}

async function searchOL(q){
  try{
    const r=await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=15&fields=key,title,author_name,cover_i,first_publish_year,subject,language,number_of_pages_median`);
    const d=await r.json();
    if(!d.docs)return[];
    return d.docs.map(doc=>({
      id:'ol_'+(doc.key?.replace('/works/','')||Math.random()),src:'ol',
      title:doc.title||'Без назви',
      authors:doc.author_name||['Невідомий автор'],
      desc:'',
      cover:doc.cover_i?`https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg`:null,
      year:doc.first_publish_year?.toString()||'',
      pages:doc.number_of_pages_median||0,
      cats:doc.subject?.slice(0,5)||[],
      lang:doc.language?.[0]||'',
      link:`https://openlibrary.org${doc.key}`,
      rating:0,rcount:0
    }));
  }catch(e){return[]}
}

function filterBooks(books){
  return books.filter(b=>{
    const t=b.title.toLowerCase();
    const c=b.cats.join(' ').toLowerCase();
    return !BLACKLIST_CAT.some(k=>c.includes(k))&&!BLACKLIST_TITLE.some(k=>t.includes(k));
  });
}

async function searchBooks(q,lang){
  const[g,o]=await Promise.all([searchGoogle(q,lang),searchOL(q)]);
  const seen=new Set();
  const combined=[...g,...o].filter(b=>{
    const k=b.title.toLowerCase()+'_'+(b.authors[0]||'').toLowerCase();
    if(seen.has(k))return false;seen.add(k);return true;
  });
  return filterBooks(combined);
}

// ============ STATE ============
let tab='home',viewMode='list',curLang='',statusFilter='all';
let searchBooks_cache=[],selBook=null,selRating=0,descExp=false;
let searchTO=null;

// ============ INIT ============
document.addEventListener('DOMContentLoaded',async()=>{
  await openDB();
  // Register SW inline via blob
  if('serviceWorker' in navigator){
    const swCode=`
const C='bs-v2',A=['/'];
self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.add('/')));self.skipWaiting()});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))));self.clients.claim()});
self.addEventListener('fetch',e=>{
  if(e.request.url.includes('googleapis')||e.request.url.includes('openlibrary')){
    e.respondWith(fetch(e.request).catch(()=>new Response('{"items":[],"docs":[]}',{headers:{'Content-Type':'application/json'}})));return;
  }
  e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(nr=>{const c=nr.clone();caches.open('${window.location?.origin||''}').then(ca=>ca.put(e.request,c));return nr;})));
});`;
    const blob=new Blob([swCode],{type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }
  renderPage();
});

// ============ NAVIGATION ============
function navigate(t){
  tab=t;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const el=document.querySelector(`[data-nav="${t}"]`);
  if(el)el.classList.add('active');
  renderPage();
}

async function renderPage(){
  switch(tab){
    case'home':await renderHome();break;
    case'library':await renderLibrary();break;
    case'search':renderSearch();break;
    case'recs':await renderRecs();break;
    case'stats':await renderStats();break;
  }
}

// ============ HOME ============
async function renderHome(){
  const main=document.getElementById('main');
  const[reading,read,want]=await Promise.all([getByStatus('reading'),getByStatus('read'),getByStatus('want')]);
  const total=reading.length+read.length+want.length;

  main.innerHTML=`
  <div class="header">
    <span style="font-size:1.4rem">📚</span>
    <h1>BookShelf</h1>
    <button class="hbtn" onclick="toggleView()">${viewMode==='grid'?'☰':'⊞'}</button>
  </div>
  <div class="stats-bar">
    <div class="stat-card"><div class="num">${reading.length}</div><div class="lbl">Читаю</div></div>
    <div class="stat-card"><div class="num">${read.length}</div><div class="lbl">Прочитав</div></div>
    <div class="stat-card"><div class="num">${want.length}</div><div class="lbl">Хочу</div></div>
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">Всього</div></div>
  </div>
  ${reading.length?`<div class="section"><div class="section-title">📖 Зараз читаю</div><div class="books-list">${reading.map(renderListItem).join('')}</div></div>`:''}
  ${want.length?`<div class="section"><div class="section-title">🔖 Хочу прочитати</div><div class="books-${viewMode}">${want.slice(0,6).map(viewMode==='grid'?renderCard:renderListItem).join('')}</div></div>`:''}
  ${!total?`<div class="empty"><div class="emo">📚</div><h3>Бібліотека порожня</h3><p>Знайди книги через пошук<br>або отримай рекомендації</p></div>`:''}`;
}

// ============ LIBRARY ============
async function renderLibrary(){
  const main=document.getElementById('main');
  const books=statusFilter==='all'?await getAllBooks():await getByStatus(statusFilter);
  main.innerHTML=`
  <div class="header"><span style="font-size:1.4rem">📚</span><h1>Бібліотека</h1><button class="hbtn" onclick="toggleView()">${viewMode==='grid'?'☰':'⊞'}</button></div>
  <div class="tabs">
    ${[['all','Всі'],['reading','📖 Читаю'],['want','🔖 Хочу'],['read','✅ Прочитав']].map(([v,l])=>`
    <button class="tab-btn ${statusFilter===v?'active':''}" onclick="setFilter('${v}')">${l}</button>`).join('')}
  </div>
  ${!books.length
    ?`<div class="empty"><div class="emo">📖</div><h3>Тут поки порожньо</h3><p>Додай книги через пошук</p></div>`
    :`<div class="section"><div class="books-${viewMode}">${books.map(viewMode==='grid'?renderCard:renderListItem).join('')}</div></div>`
  }`;
}

async function setFilter(s){statusFilter=s;await renderLibrary()}

// ============ SEARCH ============
function renderSearch(){
  const main=document.getElementById('main');
  main.innerHTML=`
  <div class="header"><span style="font-size:1.4rem">🔍</span><h1>Пошук книг</h1></div>
  <div class="search-bar">
    <input id="sInput" type="search" placeholder="Назва, автор..." autocomplete="off" value="">
    <button onclick="doSearch()">🔍</button>
  </div>
  <div class="lang-toggle">
    ${[['','🌍 Всі мови'],['uk','🇺🇦 Укр'],['ru','RU'],['en','EN']].map(([v,l])=>`
    <button class="lbtn ${curLang===v?'active':''}" onclick="setLang('${v}')">${l}</button>`).join('')}
  </div>
  <div id="sResults"><div class="empty"><div class="emo">🔍</div><h3>Шукай книги</h3><p>Google Books + Open Library<br>Мільйони книг українською, російською, англійською</p></div></div>`;

  const inp=document.getElementById('sInput');
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
  inp.addEventListener('input',()=>{
    clearTimeout(searchTO);
    if(inp.value.length>2)searchTO=setTimeout(doSearch,700);
  });
  inp.focus();
}

function setLang(l){curLang=l;renderSearch()}

async function doSearch(){
  const inp=document.getElementById('sInput');
  if(!inp)return;
  const q=inp.value.trim();
  if(!q)return;
  const cont=document.getElementById('sResults');
  cont.innerHTML='<div class="spinner-wrap"><div class="spinner"></div></div>';
  let results=await searchBooks(q,curLang);
  if(curLang){
    results=results.filter(b=>{
      const l=b.lang;
      if(curLang==='uk')return l==='uk'||l==='ukr';
      if(curLang==='ru')return l==='ru'||l==='rus';
      if(curLang==='en')return l==='en'||l==='eng';
      return true;
    });
  }
  searchBooks_cache=results;
  if(!results.length){
    cont.innerHTML='<div class="empty"><div class="emo">😔</div><h3>Нічого не знайдено</h3><p>Спробуй іншу назву або автора</p></div>';
    return;
  }
  cont.innerHTML=`<div class="section"><div class="section-title">${results.length} результатів</div><div class="books-list">${results.map(b=>renderListItem(b,true)).join('')}</div></div>`;
}

// ============ RECOMMENDATIONS ============
async function renderRecs(){
  const main=document.getElementById('main');
  main.innerHTML=`<div class="header"><span style="font-size:1.4rem">✨</span><h1>Для тебе</h1></div><div class="spinner-wrap"><div class="spinner"></div></div>`;
  const all=await getAllBooks();
  const cats={};
  all.forEach(b=>b.cats?.forEach(c=>{cats[c.toLowerCase()]=(cats[c.toLowerCase()]||0)+1}));
  const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([c])=>c);
  const q=top.length?top[0]:'bestseller fiction thriller novel';
  const results=await searchBooks(q);
  const myIds=new Set(all.map(b=>b.id));
  const recs=results.filter(b=>!myIds.has(b.id)).slice(0,12);
  if(!recs.length){
    main.innerHTML+=`<div class="empty"><div class="emo">✨</div><h3>Немає рекомендацій</h3><p>Додай кілька книг, щоб отримати персональні підбірки</p></div>`;
    return;
  }
  main.innerHTML=`<div class="header"><span style="font-size:1.4rem">✨</span><h1>Для тебе</h1></div><div class="section"><div class="section-title">На основі твоїх смаків</div><div class="books-grid">${recs.map(renderCard).join('')}</div></div>`;
}

// ============ STATS ============
async function renderStats(){
  const main=document.getElementById('main');
  const all=await getAllBooks();
  const read=all.filter(b=>b.status==='read');
  const reading=all.filter(b=>b.status==='reading');
  const want=all.filter(b=>b.status==='want');
  const pages=read.reduce((s,b)=>s+(b.pages||0),0);
  const rated=read.filter(b=>b.userRating);
  const avg=rated.length?(rated.reduce((s,b)=>s+(b.userRating||0),0)/rated.length).toFixed(1):'—';
  const cats={};
  all.forEach(b=>b.cats?.forEach(c=>{cats[c]=(cats[c]||0)+1}));
  const topCats=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const best=read.filter(b=>b.userRating>=4).sort((a,b)=>(b.userRating||0)-(a.userRating||0)).slice(0,5);

  main.innerHTML=`
  <div class="header"><span style="font-size:1.4rem">📊</span><h1>Статистика</h1></div>
  <div class="stats-bar">
    <div class="stat-card"><div class="num">${read.length}</div><div class="lbl">Прочитано</div></div>
    <div class="stat-card"><div class="num">${reading.length}</div><div class="lbl">Читаю</div></div>
    <div class="stat-card"><div class="num">${pages.toLocaleString()}</div><div class="lbl">Сторінок</div></div>
    <div class="stat-card"><div class="num">${avg}</div><div class="lbl">Ср.оцінка</div></div>
  </div>
  ${topCats.length?`<div class="section"><div class="section-title">Топ жанрів</div>${topCats.map(([c,n])=>`
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:3px"><span>${c}</span><span style="color:var(--text2)">${n}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${Math.round(n/all.length*100)}%"></div></div>
    </div>`).join('')}</div>`:''}
  ${best.length?`<div class="section"><div class="section-title">⭐ Найкращі</div><div class="books-list">${best.map(renderListItem).join('')}</div></div>`:''}
  ${!all.length?`<div class="empty"><div class="emo">📊</div><h3>Статистика порожня</h3><p>Додай книги щоб побачити аналітику</p></div>`:''}`;
}

// ============ RENDER HELPERS ============
function renderCard(b){
  const badge=b.status?`<span class="status-badge badge-${b.status}">${b.status==='reading'?'📖':b.status==='read'?'✅':'🔖'}</span>`:'';
  return `<div class="book-card" onclick="openBook('${esc(b.id)}')">${badge}
    <div class="cover-wrap">${b.cover?`<img src="${b.cover}" loading="lazy" alt="">`:'📚'}</div>
    <div class="info">
      <div class="title">${esc(b.title)}</div>
      <div class="author">${esc(b.authors?.[0]||'')}</div>
      ${b.userRating?`<div class="stars">${'★'.repeat(b.userRating)}${'☆'.repeat(5-b.userRating)}</div>`:''}
    </div></div>`;
}

function renderListItem(b,showSrc=false){
  const pct=b.status==='reading'&&b.curPage&&b.pages?Math.round(b.curPage/b.pages*100):0;
  return `<div class="book-list-item" onclick="openBook('${esc(b.id)}')">
    <div class="mini-cover">${b.cover?`<img src="${b.cover}" loading="lazy" alt="">`:'📚'}</div>
    <div class="bk-meta">
      <div class="title">${esc(b.title)}</div>
      <div class="author">${esc(b.authors?.[0]||'Невідомий автор')}</div>
      <div class="extra">
        ${b.status?`<span class="tag ${b.status==='reading'?'badge-reading':b.status==='read'?'badge-read':'badge-want'}">${b.status==='reading'?'📖 Читаю':b.status==='read'?'✅ Прочитав':'🔖 Хочу'}</span>`:''}
        ${b.year?`<span class="tag">${b.year}</span>`:''}
        ${b.pages?`<span class="tag">${b.pages} стор.</span>`:''}
        ${showSrc?`<span class="tag">${b.src==='google'?'🔵 Google':'📗 OL'}</span>`:''}
      </div>
      ${pct?`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><div style="font-size:0.7rem;color:var(--text2)">${pct}%</div>`:''}
      ${b.userRating?`<div class="stars">${'★'.repeat(b.userRating)}${'☆'.repeat(5-b.userRating)}</div>`:''}
    </div></div>`;
}

// ============ MODAL ============
async function openBook(id){
  let b=await getBook(id)||searchBooks_cache.find(x=>x.id===id);
  if(!b)return;
  selBook=b;selRating=b.userRating||0;descExp=false;
  const saved=!!(await getBook(id));
  const overlay=document.getElementById('modalOverlay');
  document.getElementById('modalContent').innerHTML=`
  <div class="modal-handle"></div>
  <div class="mc">
    <div class="m-cover">${b.cover?`<img src="${b.cover}" alt="">`:'📚'}</div>
    <div class="m-title">${esc(b.title)}</div>
    <div class="m-author">${esc(b.authors?.join(', ')||'')}</div>
    ${b.desc?`<div class="m-desc" id="mDesc">${esc(b.desc)}</div>
    <button onclick="toggleDesc()" style="background:none;border:none;color:var(--accent);font-size:0.82rem;cursor:pointer;margin-bottom:12px;padding:0">Читати більше ▾</button>`:''}
    <div class="info-row">
      ${b.year?`<span class="info-chip">📅 ${b.year}</span>`:''}
      ${b.pages?`<span class="info-chip">📄 ${b.pages} стор.</span>`:''}
      ${b.lang?`<span class="info-chip">🌐 ${langN(b.lang)}</span>`:''}
      ${b.rating?`<span class="info-chip">⭐ ${b.rating} (${b.rcount})</span>`:''}
    </div>
    <div class="section-title" style="margin-bottom:8px">Статус</div>
    <div class="status-btns">
      <button class="sbtn ${b.status==='want'?'aw':''}" onclick="setStatus('want')"><span class="si">🔖</span>Хочу</button>
      <button class="sbtn ${b.status==='reading'?'ar':''}" onclick="setStatus('reading')"><span class="si">📖</span>Читаю</button>
      <button class="sbtn ${b.status==='read'?'ad':''}" onclick="setStatus('read')"><span class="si">✅</span>Прочитав</button>
    </div>
    ${b.status==='reading'?`
    <div class="section-title" style="margin-bottom:8px">Прогрес читання</div>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      <input class="page-input" type="number" id="pageInp" value="${b.curPage||0}" min="0" max="${b.pages||9999}" onchange="updateProgress(this.value)">
      <span style="color:var(--text2);font-size:0.85rem">з ${b.pages||'?'} стор.</span>
      ${b.pages?`<div style="flex:1;min-width:80px"><div class="progress-bar"><div class="progress-fill" id="mpf" style="width:${b.curPage?Math.round(b.curPage/b.pages*100):0}%"></div></div></div>`:''}
    </div>`:''}
    ${b.status==='read'?`
    <div class="section-title" style="margin-bottom:8px">Моя оцінка</div>
    <div class="rating-input" id="ratingRow">
      ${[1,2,3,4,5].map(i=>`<span class="rstar ${i<=selRating?'on':''}" onclick="setRating(${i})">★</span>`).join('')}
    </div>`:''}
    <div class="section-title" style="margin-bottom:8px">Нотатки</div>
    <textarea class="notes-area" id="notesArea" placeholder="Думки, цитати, враження...">${esc(b.notes||'')}</textarea>
    ${saved?`
      <button class="btn-p" onclick="saveData()">💾 Зберегти</button>
      ${b.link?`<a class="link-btn" href="${b.link}" target="_blank">🔗 Читати онлайн</a>`:''}
      <button class="btn-s" onclick="removeBook()" style="color:#e74c3c">🗑 Видалити</button>
    `:`
      <button class="btn-p" onclick="addBook('want')">🔖 Хочу прочитати</button>
      <button class="btn-s" onclick="addBook('reading')">📖 Зараз читаю</button>
      ${b.link?`<a class="link-btn" href="${b.link}" target="_blank">🔗 Читати онлайн</a>`:''}
    `}
  </div>`;
  overlay.classList.add('open');
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('open');selBook=null}
function toggleDesc(){const el=document.getElementById('mDesc');if(el)el.classList.toggle('exp')}

async function setStatus(s){
  if(!selBook)return;
  selBook.status=s;
  document.querySelectorAll('.sbtn').forEach(b=>{b.className='sbtn'});
  const map={want:'sbtn aw',reading:'sbtn ar',read:'sbtn ad'};
  event.currentTarget.className=map[s];
  const ex=await getBook(selBook.id);
  if(ex){ex.status=s;await saveBook(ex);toast(`Статус: ${s==='reading'?'Читаю':s==='read'?'Прочитав':'Хочу читати'}`)}
  // refresh to show/hide progress
  await openBook(selBook.id);
}

async function addBook(status){
  if(!selBook)return;
  const b={...selBook,status,addedAt:Date.now()};
  await saveBook(b);toast('📚 Додано до бібліотеки!');
  await openBook(b.id);
}

async function saveData(){
  if(!selBook)return;
  const ex=await getBook(selBook.id);
  if(ex){
    ex.notes=document.getElementById('notesArea')?.value||'';
    ex.userRating=selRating;
    await saveBook(ex);toast('✅ Збережено!');
  }
}

async function removeBook(){
  if(!selBook)return;
  await deleteBook(selBook.id);closeModal();toast('🗑 Видалено');
  renderPage();
}

async function updateProgress(v){
  if(!selBook)return;
  const b=await getBook(selBook.id);
  if(!b)return;
  b.curPage=parseInt(v)||0;await saveBook(b);
  if(b.pages){const p=Math.round(b.curPage/b.pages*100);const f=document.getElementById('mpf');if(f)f.style.width=p+'%'}
}

function setRating(r){
  selRating=r;
  document.querySelectorAll('.rstar').forEach((s,i)=>s.classList.toggle('on',i<r));
}

// ============ UTILS ============
function toggleView(){viewMode=viewMode==='grid'?'list':'grid';renderPage()}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function langN(c){return{uk:'🇺🇦 Укр',ru:'RU',en:'🇬🇧 EN',de:'DE',fr:'FR',pl:'PL'}[c]||c}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

// Swipe down to close modal
(()=>{
  const ov=document.getElementById('modalOverlay');
  let sy=0;
  ov.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});
  ov.addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-sy>80)closeModal()},{passive:true});
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal()});
})();
</script>
</body>
</html>

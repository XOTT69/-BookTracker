<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BookShelf">
  <meta name="theme-color" content="#1a1a2e">
  <title>BookShelf</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div id="main"></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-nav="home" onclick="navigate('home')">
    <span class="icon">🏠</span>Головна
  </button>
  <button class="nav-btn" data-nav="library" onclick="navigate('library')">
    <span class="icon">📚</span>Бібліотека
  </button>
  <button class="nav-btn" data-nav="search" onclick="navigate('search')">
    <span class="icon">🔍</span>Пошук
  </button>
  <button class="nav-btn" data-nav="recommendations" onclick="navigate('recommendations')">
    <span class="icon">✨</span>Для тебе
  </button>
  <button class="nav-btn" data-nav="stats" onclick="navigate('stats')">
    <span class="icon">📊</span>Статистика
  </button>
</nav>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div id="modalContent"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- SCRIPTS -->
<script src="/js/db.js"></script>
<script src="/js/api.js"></script>
<script src="/js/recommendations.js"></script>
<script src="/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мої Книги</title>
    
    <!-- PWA / iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Книги">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
</head>
<body>
    <!-- Header -->
    <header>
        <h1 id="header-title">Бібліотека</h1>
    </header>

    <!-- Main Content Areas -->
    <main>
        <!-- Tab: Library -->
        <section id="tab-library" class="tab-content active">
            <div class="filters">
                <button class="filter-btn active" data-status="reading">Читаю</button>
                <button class="filter-btn" data-status="want">Хочу</button>
                <button class="filter-btn" data-status="read">Прочитано</button>
            </div>
            <div id="library-list" class="book-grid"></div>
        </section>

        <!-- Tab: Search -->
        <section id="tab-search" class="tab-content">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Пошук книг (укр/рос)...">
                <button id="search-btn">Знайти</button>
            </div>
            <div id="search-results" class="book-grid"></div>
        </section>

        <!-- Tab: Recommendations -->
        <section id="tab-recommendations" class="tab-content">
            <!-- На основі прочитаного -->
            <div class="recommendation-section">
                <h2 class="section-title">✨ Для вас</h2>
                <p id="personal-hint" class="hint-text">Прочитайте кілька книг, щоб поради стали точнішими.</p>
                <div id="rec-personal" class="book-row"></div>
            </div>

            <!-- Магічна академія -->
            <div class="recommendation-section">
                <h2 class="section-title">🔮 Магічна академія</h2>
                <p class="hint-text">Найкраще про навчання магії</p>
                <div id="rec-magic" class="book-row"></div>
            </div>

            <!-- Випадковий жанр -->
            <div class="recommendation-section">
                <h2 id="dynamic-genre-title" class="section-title">📚 Інші жанри</h2>
                <div id="rec-genre" class="book-row"></div>
            </div>
        </section>

        <!-- Tab: Reader -->
        <section id="tab-reader" class="tab-content">
            <div id="reader-controls">
                <button id="close-reader">🔙 Назад</button>
                <button id="prev-page">⬅️</button>
                <button id="next-page">➡️</button>
            </div>
            <div id="viewer" class="spreads"></div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-target="tab-library">📚 Бібліотека</button>
        <button class="nav-item" data-target="tab-search">🔍 Пошук</button>
        <button class="nav-item" data-target="tab-recommendations">💡 Поради</button>
    </nav>

    <!-- Book Details Modal -->
    <div id="book-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <img id="modal-cover" src="" alt="Обкладинка">
            <h2 id="modal-title"></h2>
            <p id="modal-author"></p>
            <select id="modal-status">
                <option value="want">Хочу прочитати</option>
                <option value="reading">Читаю зараз</option>
                <option value="read">Прочитано</option>
            </select>
            <div class="upload-section">
                <label for="epub-upload" class="upload-btn">📥 Додати .epub файл для читання</label>
                <input type="file" id="epub-upload" accept=".epub" style="display: none;">
            </div>
            <button id="save-book-btn" class="primary-btn">Зберегти в бібліотеку</button>
            <button id="read-book-btn" class="primary-btn" style="display: none; background: #34c759;">Відкрити читалку</button>
            <button id="delete-book-btn" class="danger-btn" style="display: none;">Видалити</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>

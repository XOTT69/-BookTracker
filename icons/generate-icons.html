<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Генератор іконок BookTracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #667eea; }
        .icons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        canvas {
            border: 1px solid #e2e8f0;
            border-radius: 20%;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #5a67d8; }
        .download-all {
            font-size: 18px;
            padding: 15px 40px;
            margin: 30px 0;
        }
        .instructions {
            background: #f7fafc;
            padding: 20px;
            border-radius: 12px;
            text-align: left;
            margin-top: 30px;
        }
        .instructions h3 { color: #667eea; }
        .instructions ol { padding-left: 20px; }
        .instructions li { margin: 10px 0; }
        code {
            background: #edf2f7;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>📚 BookTracker - Генератор іконок</h1>
    <p>Натисніть на кнопку, щоб завантажити всі іконки для PWA</p>
    
    <button class="download-all" onclick="downloadAllIcons()">
        📥 Завантажити всі іконки
    </button>
    
    <div class="icons-grid" id="icons-grid"></div>
    
    <div class="instructions">
        <h3>📋 Інструкція:</h3>
        <ol>
            <li>Натисніть "Завантажити всі іконки"</li>
            <li>Створіть папку <code>icons</code> у вашому проекті</li>
            <li>Розпакуйте завантажені іконки в цю папку</li>
            <li>Структура має бути: <code>/icons/icon-72x72.png</code>, тощо</li>
        </ol>
    </div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const iconsGrid = document.getElementById('icons-grid');

        function createIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Фон з градієнтом
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#5a67d8');
            
            // Закруглений прямокутник
            const radius = size * 0.2;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();

            // Тінь для книги
            ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
            ctx.shadowBlur = size * 0.05;
            ctx.shadowOffsetY = size * 0.02;

            // Книга
            const bookWidth = size * 0.5;
            const bookHeight = size * 0.6;
            const bookX = (size - bookWidth) / 2;
            const bookY = (size - bookHeight) / 2;

            // Обкладинка книги
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.roundRect(bookX, bookY, bookWidth, bookHeight, size * 0.05);
            ctx.fill();

            // Скидаємо тінь
            ctx.shadowColor = 'transparent';

            // Корінець книги
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(bookX, bookY, size * 0.06, bookHeight);

            // Лінії тексту
            ctx.fillStyle = '#a0aec0';
            const lineHeight = size * 0.04;
            const lineWidth = bookWidth * 0.6;
            const lineX = bookX + bookWidth * 0.25;
            const startY = bookY + bookHeight * 0.25;

            for (let i = 0; i < 4; i++) {
                const y = startY + i * (lineHeight * 2);
                const width = i === 3 ? lineWidth * 0.6 : lineWidth;
                ctx.fillRect(lineX, y, width, lineHeight);
            }

            // Закладка
            ctx.fillStyle = '#f56565';
            const ribbonWidth = size * 0.08;
            const ribbonX = bookX + bookWidth - ribbonWidth - size * 0.08;
            ctx.beginPath();
            ctx.moveTo(ribbonX, bookY);
            ctx.lineTo(ribbonX + ribbonWidth, bookY);
            ctx.lineTo(ribbonX + ribbonWidth, bookY + bookHeight * 0.35);
            ctx.lineTo(ribbonX + ribbonWidth / 2, bookY + bookHeight * 0.28);
            ctx.lineTo(ribbonX, bookY + bookHeight * 0.35);
            ctx.closePath();
            ctx.fill();

            return canvas;
        }

        // Створюємо превью іконок
        sizes.forEach(size => {
            const canvas = createIcon(size);
            const item = document.createElement('div');
            item.className = 'icon-item';
            
            const previewSize = Math.min(size, 128);
            canvas.style.width = previewSize + 'px';
            canvas.style.height = previewSize + 'px';
            
            const label = document.createElement('span');
            label.textContent = `${size}x${size}`;
            
            const btn = document.createElement('button');
            btn.textContent = '📥 Завантажити';
            btn.onclick = () => downloadIcon(size);
            
            item.appendChild(canvas);
            item.appendChild(label);
            item.appendChild(btn);
            iconsGrid.appendChild(item);
        });

        function downloadIcon(size) {
            const canvas = createIcon(size);
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        async function downloadAllIcons() {
            // Завантажуємо кожну іконку з невеликою затримкою
            for (const size of sizes) {
                downloadIcon(size);
                await new Promise(r => setTimeout(r, 300));
            }
            
            // Також створюємо badge
            downloadBadge();
            
            // Shortcut іконки
            await new Promise(r => setTimeout(r, 300));
            downloadShortcutIcon('add', '➕');
            await new Promise(r => setTimeout(r, 300));
            downloadShortcutIcon('library', '📚');
            await new Promise(r => setTimeout(r, 300));
            downloadShortcutIcon('read', '📖');
            
            alert('✅ Всі іконки завантажено! Створіть папку "icons" і перемістіть їх туди.');
        }

        function downloadBadge() {
            const canvas = document.createElement('canvas');
            canvas.width = 72;
            canvas.height = 72;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#667eea';
            ctx.beginPath();
            ctx.arc(36, 36, 36, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 36px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('📚', 36, 36);
            
            const link = document.createElement('a');
            link.download = 'badge-72x72.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function downloadShortcutIcon(name, emoji) {
            const canvas = document.createElement('canvas');
            canvas.width = 192;
            canvas.height = 192;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createLinearGradient(0, 0, 192, 192);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#5a67d8');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.roundRect(0, 0, 192, 192, 40);
            ctx.fill();
            
            ctx.font = '80px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(emoji, 96, 96);
            
            const link = document.createElement('a');
            link.download = `shortcut-${name}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
